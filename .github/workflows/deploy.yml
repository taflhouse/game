name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Push database migrations
        run: supabase db push --db-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ github.ref_name == 'main' && secrets.PROD_DATABASE_URL || secrets.STAGING_DATABASE_URL }}

      - name: Push auth config (Postmark SMTP, site URL)
        run: supabase config push --yes --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ github.ref_name == 'main' && secrets.PROD_PROJECT_REF || secrets.STAGING_PROJECT_REF }}
          POSTMARK_API_TOKEN: ${{ github.ref_name == 'main' && secrets.PROD_POSTMARK_API_TOKEN || secrets.STAGING_POSTMARK_API_TOKEN }}
          SITE_URL: ${{ github.ref_name == 'main' && 'https://taflhouse.com' || 'https://qa.taflhouse.com' }}
          SITE_URL_WILDCARD: ${{ github.ref_name == 'main' && 'https://taflhouse.com/**' || 'https://qa.taflhouse.com/**' }}

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-${{ hashFiles('flake.lock') }}
          restore-keys: nix-

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: cabal-${{ hashFiles('cabal.project', '*.cabal') }}
          restore-keys: cabal-

      - name: Build
        run: |
          nix develop .#wasm --command bash -c '
            wasm32-wasi-cabal update
            wasm32-wasi-cabal build
            rm -rf public
            cp -r static public
            sed -i "s|__SUPABASE_URL__|$SUPABASE_URL|g" public/index.js
            sed -i "s|__SUPABASE_KEY__|$SUPABASE_KEY|g" public/index.js
            sed -i "s|__VAPID_PUBLIC_KEY__|$VAPID_PUBLIC_KEY|g" public/index.js
            MY_WASM=$(wasm32-wasi-cabal list-bin app | tail -n 1)
            $(wasm32-wasi-ghc --print-libdir)/post-link.mjs --input "$MY_WASM" --output public/ghc_wasm_jsffi.js
            cp "$MY_WASM" public/
            wasm-opt -all -O2 public/app.wasm -o public/app.wasm
            wasm-tools strip -o public/app.wasm public/app.wasm
          '
        env:
          SUPABASE_URL: ${{ github.ref_name == 'main' && secrets.PROD_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
          SUPABASE_KEY: ${{ github.ref_name == 'main' && secrets.PROD_SUPABASE_KEY || secrets.STAGING_SUPABASE_KEY }}
          VAPID_PUBLIC_KEY: ${{ github.ref_name == 'main' && secrets.PROD_VAPID_PUBLIC_KEY || secrets.STAGING_VAPID_PUBLIC_KEY }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ github.ref_name == 'main' && secrets.PROD_PROJECT_REF || secrets.STAGING_PROJECT_REF }}

      # DB triggers read these from Vault to call the edge functions; without
      # them, push notifications and tournament round advancement silently no-op.
      - name: Sync Vault secrets for DB-triggered edge functions
        run: |
          SERVICE_KEY=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$SERVICE_KEY"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v service_key="$SERVICE_KEY" \
            -v push_url="$SUPABASE_URL/functions/v1/send-push" \
            -v tournament_url="$SUPABASE_URL/functions/v1/tournament-advance" <<'SQL'
          SELECT vault.create_secret(:'service_key', 'service_role_key')
            WHERE NOT EXISTS (SELECT 1 FROM vault.secrets WHERE name = 'service_role_key');
          SELECT vault.update_secret(id, :'service_key') FROM vault.secrets WHERE name = 'service_role_key';
          SELECT vault.create_secret(:'push_url', 'push_edge_fn_url')
            WHERE NOT EXISTS (SELECT 1 FROM vault.secrets WHERE name = 'push_edge_fn_url');
          SELECT vault.update_secret(id, :'push_url') FROM vault.secrets WHERE name = 'push_edge_fn_url';
          SELECT vault.create_secret(:'tournament_url', 'tournament_advance_fn_url')
            WHERE NOT EXISTS (SELECT 1 FROM vault.secrets WHERE name = 'tournament_advance_fn_url');
          SELECT vault.update_secret(id, :'tournament_url') FROM vault.secrets WHERE name = 'tournament_advance_fn_url';
          SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ github.ref_name == 'main' && secrets.PROD_PROJECT_REF || secrets.STAGING_PROJECT_REF }}
          DATABASE_URL: ${{ github.ref_name == 'main' && secrets.PROD_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          SUPABASE_URL: ${{ github.ref_name == 'main' && secrets.PROD_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config ${{ github.ref_name == 'main' && 'wrangler.production.toml' || 'wrangler.staging.toml' }}
