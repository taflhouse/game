<!DOCTYPE html>
<html lang="en" class="theme-cosmic">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Taflhouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.6/dist/js/all.min.js"></script>
    <link href="/assets/styles.css" rel="stylesheet" />
    <script>
      // Apply the stored theme (or the OS preference, if "system"/nothing is
      // stored) before first paint to avoid a flash.
      var storedTheme = localStorage.getItem('taflhouse_theme');
      var prefersDark = storedTheme ? storedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (prefersDark) document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <script src="/index.js" type="module"></script>
  </body>
</html>
