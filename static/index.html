<!DOCTYPE html>
<html lang="en" class="dark theme-cosmic">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Taflhouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="/assets/styles.css" rel="stylesheet" />

      // Restore theme before first paint to avoid flash
      if (localStorage.getItem('taflhouse_theme') === 'light') {
        document.documentElement.classList.remove('dark');
      }
    </script>

  <body>
    <script src="/index.js" type="module"></script>
